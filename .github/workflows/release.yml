name: Release

# Builds and publishes the daemon for a release tag, from this repository's own source: the image
# on GHCR, with a signed provenance attestation that names this run, and the compose bundle that
# runs it beside Dapr and Postgres. The daemon is one container of five; deploy/README.md
# describes the topology.
#
# Only a tag starts it, and the tag is created by the Utos release, which decides the version and
# which components carry it. A push to a branch never publishes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # the GitHub release
  packages: write       # the image
  id-token: write       # signing the attestation
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/utos/daemon-dapr

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The version this tag releases
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          grep -qE "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no dated heading for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The SDK the daemon pins may be released by the same Utos release, minutes ago, and not be
      # listed on nuget.org yet.
      - name: Wait for the pinned SDK packages
        run: |
          set -euo pipefail
          grep -oE 'Include="Utos\.[^"]*" Version="[^"]*"' Directory.Packages.props \
            | sed -E 's/Include="([^"]*)" Version="([^"]*)"/\1 \2/' | while read -r name version; do
              url="https://api.nuget.org/v3-flatcontainer/${name,,}/${version}/${name,,}.${version}.nupkg"
              for _ in $(seq 1 90); do
                curl -sfI "$url" > /dev/null && { echo "$name $version is available"; continue 2; }
                sleep 20
              done
              echo "::error::$name $version is not on nuget.org after 30 minutes"; exit 1
            done

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # The bundle pins the image this release built, not whatever `latest` has become since.
      - name: Package the compose bundle
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          STAGE=$(mktemp -d)/utos-daemon-${VERSION}
          mkdir -p "$STAGE" dist
          cp -r deploy/compose/. "$STAGE/"
          cp deploy/README.md CHANGELOG.md "$STAGE/"
          sed -i "s#ghcr.io/utos/daemon-dapr:latest#${IMAGE}:${VERSION}#" "$STAGE/docker-compose.yml"
          tar -czf "dist/utos-daemon-${VERSION}-compose.tar.gz" -C "$(dirname "$STAGE")" "utos-daemon-${VERSION}"
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Attest the bundle's provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="## [$VERSION]" 'index($0, v) == 1 { grab = 1; next } /^## \[/ && grab { exit } grab { print }' CHANGELOG.md > notes.md
          printf '\n## Run it\n\n```\ndocker pull %s:%s\ntar -xzf utos-daemon-%s-compose.tar.gz && cd utos-daemon-%s && docker compose up -d\n```\n' \
            "$IMAGE" "$VERSION" "$VERSION" "$VERSION" >> notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "utos daemon $VERSION" --notes-file notes.md dist/*
          fi
