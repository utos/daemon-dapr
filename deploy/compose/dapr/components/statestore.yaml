# The actor state store Dapr Workflow keeps orchestration state in. Redis, as `dapr init`
# provisions locally; any Dapr state store that supports actors would do.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "true"
