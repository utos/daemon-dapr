name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # First, because it is the cheapest thing that can be wrong and the most expensive to
      # discover late: at release time the mistake is a tag and a published artifact.
      - name: Version parity
        run: scripts/check-version-parity.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Utos.Daemon.sln

      - name: Build
        run: dotnet build Utos.Daemon.sln --no-restore --configuration Release

      # Unit tests only. The integration suite needs Docker and a Dapr sidecar, so it stays
      # a local step; these exercise the interpreter and need neither. The engine hardening
      # suite is adversarial and runs on its own schedule (engine-hardening.yml).
      - name: Unit tests
        run: dotnet test tests/UnitTests/UnitTests.csproj --no-build --configuration Release
